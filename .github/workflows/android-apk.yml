name: Android APK

on:
  push:
    branches: [main, "feat/**", "fix/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      build_release:
        description: Build optimized Release APK
        type: boolean
        default: false
        required: false

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: trackr-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build Release APK (tag or manual request)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.build_release == true
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload Release APK
        if: startsWith(github.ref, 'refs/tags/v') || inputs.build_release == true
        uses: actions/upload-artifact@v4
        with:
          name: trackr-release-${{ github.ref_name }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
